name: Upload

on:
  push:
    branches:
      - main
  pull_request: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 24
        package-manager-cache: false

    - name: Enable Corepack
      run: |
        corepack enable
        corepack prepare yarn@4.12.0 --activate
        yarn --version

    - uses: calcit-lang/setup-calcit@ca701be5a471759e442aa053cd100720bbe1f09f # v1.5.0
      with:
        tools: calcit,caps
        caps-version: "0.1.1"

    - name: Validate and build
      run: |
        set -euo pipefail
        caps --ci
        yarn install --immutable
        caps verify --toolchain
        calcit calcit.cirru edit format
        git diff --exit-code -- calcit.cirru
        test "$(calcit --version)" = "0.22.0-alpha.3"
        calcit calcit.cirru --check-only
        calcit calcit.cirru analyze dynamic-methods
        calcit calcit.cirru analyze check-types --summary-only
        calcit calcit.cirru js
        calcit calcit.cirru analyze deprecated --summary-only
        yarn build

    - name: Deploy to server
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      id: deploy
      uses: Pendect/action-rsyncer@8e05ffa5c93e5d9c9b167796b26044d2c616b2b9 # v2.0.0
      env:
        DEPLOY_KEY: ${{secrets.rsync_private_key}}
      with:
        flags: '-avzr --progress'
        options: ''
        ssh_options: ''
        src: 'dist/*'
        dest: 'rsync-user@tiye.me:/web-assets/repo/${{ github.repository }}'

    - name: Display status from deploy
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      run: echo "${{ steps.deploy.outputs.status }}"

    # Shadow upload follows the existing production deployment.
    - name: Select COS prefix
      id: cos-path
      if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
      env:
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          echo "prefix=${GITHUB_REPOSITORY}/pr/${PR_NUMBER}/${GITHUB_RUN_ID}/" >> "$GITHUB_OUTPUT"
        else
          echo "prefix=${GITHUB_REPOSITORY}/" >> "$GITHUB_OUTPUT"
        fi

    - name: Upload static assets to COS
      if: steps.cos-path.outcome == 'success'
      uses: worktools/cos-upload-action@0ce57b26b03dbdd27a4a544a06d453415932c62d # v1.0.0
      with:
        source-dir: dist
        bucket: ${{ secrets.COS_BUCKET }}
        region: ap-shanghai
        prefix: ${{ steps.cos-path.outputs.prefix }}
        secret-id: ${{ secrets.COS_SECRET_ID }}
        secret-key: ${{ secrets.COS_SECRET_KEY }}

    - name: Verify uploaded page through public CDN
      if: steps.cos-path.outcome == 'success'
      env:
        COS_ASSET_PREFIX: ${{ steps.cos-path.outputs.prefix }}
      run: |
        for attempt in 1 2 3 4 5 6; do
          if curl --fail --location --retry 2 --retry-delay 2 --retry-all-errors \
            "https://cos-sh.tiye.me/${COS_ASSET_PREFIX}index.html?run=${GITHUB_RUN_ID}-${attempt}" \
            --output "$RUNNER_TEMP/cos-index.html" && \
            cmp -s dist/index.html "$RUNNER_TEMP/cos-index.html"; then
            echo "CDN index.html matches dist/index.html on attempt ${attempt}"
            exit 0
          fi
          sleep 2
        done
        echo 'CDN index.html did not match dist/index.html after 6 attempts' >&2
        exit 1
